specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: ExlService Holdings
providerId: exlservice-holdings
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Analytics
  - Digital Operations
  - BPO
description: 'FinOps view of ExlService Holdings: invoicing is contract-driven (managed-services retainers,
  FTE-based, T&M, or outcome-based) rather than usage-metered. The FOCUS shape is professional-services
  billing rather than a metered API.'
sources:
  - https://www.exlservice.com
notes: No public pricing or metered billing. FinOps controls focus on engagement-level budget tracking.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: ExlService Holdings, Inc.
serviceCategory: Analytics / Digital Operations / BPO
billingModel:
  pricingCategory: Custom Contract / Managed Services
  billingFrequency: Monthly (per SOW)
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: ExlService Holdings
  ServiceCategory: Analytics / Digital Operations / BPO
  ProviderName: ExlService Holdings
  PublisherName: ExlService Holdings, Inc.
  InvoiceIssuerName: ExlService Holdings, Inc.
  BillingCurrency: USD
meters:
  - name: managed_services_fees
    unit: month
    aggregation: sum
    dimensions:
      - sow
      - cost_center
  - name: fte_count
    unit: fte
    aggregation: max
    dimensions:
      - role
      - sow
  - name: outcome_based_fees
    unit: USD
    aggregation: sum
    dimensions:
      - kpi
      - sow
principles:
  - name: Visibility
    description: Track EXL SOW spend in your AP system; reconcile invoices monthly against milestones
      and FTE consumption reports.
  - name: Allocation
    description: Tag SOWs with consuming business unit/product so engagement spend is allocable.
  - name: Optimization
    description: Convert T&M to fixed-fee or outcome-based pricing once volume is predictable; rebadge
      offshore where appropriate; renegotiate at renewal.
  - name: Accountability
    description: Engagement owner approves invoices; finance reviews variance from forecast monthly.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
